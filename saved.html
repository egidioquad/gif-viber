<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>
  <style>
    h1,
    button,
    p,
    span,
    a {
      font-family: "Quicksand", sans-serif;
    }
  </style>
  <body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-black p-3 w-80 text-white">
    <div class="bg-purple-950/70 border border-purple-700 rounded-xl shadow-lg space-y-3 p-3">
      <div class="flex items-center justify-between">
        <div class="space-y-0.5">
          <h1 class="font-bold text-lg text-purple-100">Saved images</h1>
          <p class="text-xs text-purple-200">Tap a GIF to apply it</p>
        </div>
        <button
          id="backButton"
          class="h-9 px-3 bg-purple-800/80 hover:bg-purple-700 text-white rounded-lg text-sm border border-purple-600">
          Back
        </button>
      </div>

      <div class="flex items-center justify-between text-xs text-purple-200">
        <button
          id="refreshSaved"
          class="underline hover:text-purple-100">Refresh</button>
        <span id="activeLabel" class="text-purple-300"></span>
      </div>

      <div
        id="savedGrid"
        class="grid grid-cols-2 gap-3 max-h-80 overflow-y-auto bg-purple-900/40 rounded-lg p-2 border border-purple-800">
      </div>

      <p id="emptyState" class="text-center text-sm text-purple-300 hidden">
        No saved GIFs yet. Try saving one from the main screen.
      </p>

      <script src="saved.js"></script>
    </div>
  </body>
</html>
