<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="https://www.paypalobjects.com/donate/en_US/button.css" />
  </head>
  <style>
    h1,
    p,
    button,
    a {
      font-family: "Quicksand", sans-serif;
    }
  </style>
  <body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-black p-3 w-80 text-white">
    <div class="bg-purple-950/70 border border-purple-700 rounded-xl shadow-lg space-y-3 p-4">
      <div class="flex items-center justify-between">
        <div class="space-y-0.5">
          <h1 class="font-bold text-lg text-purple-100">GIF Viber</h1>
          <p class="text-xs text-purple-200">Thanks for vibing with us!</p>
        </div>
        <button
          onclick="window.location.href='hello.html'"
          class="h-9 px-3 bg-purple-800/80 hover:bg-purple-700 text-white rounded-lg text-sm border border-purple-600">
          Back
        </button>
      </div>

      <div class="space-y-3 bg-purple-900/40 rounded-lg p-3 border border-purple-800">
        <p class="text-sm text-purple-100">This add-on lets you pin your favorite GIFs and quickly swap them while you browse.</p>
        <p class="text-sm text-purple-200">Save links in the main popup, then open the saved images page to apply any GIF with a tap.</p>
      </div>

      <div class="space-y-2 bg-purple-900/40 rounded-lg p-3 border border-purple-800 text-center">
        <p class="text-sm text-purple-100 font-semibold">Enjoying the vibes?</p>
        <form action="https://www.paypal.com/donate" method="post" target="_blank" class="flex flex-col items-center gap-2">
          <input type="hidden" name="hosted_button_id" value="KRH69Q7H86ANE" />
          <button
            type="submit"
            class="w-full h-10 bg-indigo-500 text-white rounded-lg text-sm hover:bg-indigo-400 border border-purple-600 flex items-center justify-center gap-2">
            <img src="https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif" class="h-5" alt="Donate" />
            <span>Donate</span>
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
