<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>
  <style>
    input[type="range"] {
      /* Set track color */
      --track-color: #c4b5fd;

      /* Remove default styles */
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: var(--track-color);
      outline: none;
      margin: 10px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      /* Set thumb color */
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border-color: #a78bfa;
      background: #fff;
      cursor: pointer;
      border: 1px solid var(--track-color);
    }

    input[type="range"]:active::-webkit-slider-thumb {
      background: #a78bfa;
    }

    h1 {
      font-family: "Quicksand", sans-serif;
    }
    label {
      font-family: "Quicksand", sans-serif;
    }
  </style>
  <style>
    /* Hide the default checkbox */
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* Style the slider */
    .switch .slider {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
      border-radius: 20px;
      background-color: #ccc;
      transition: background-color 0.3s ease;
    }

    /* Style the slider's active state */
    .switch input:checked + .slider {
      background-color: #a78bfa; /* Change to your desired active color */
    }

    /* Style the circle knob */
    .switch .slider::before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      border-radius: 50%;
      background-color: white;
      transition: transform 0.3s ease;
    }

    /* Move the circle knob to the checked position */
    .switch input:checked + .slider::before {
      transform: translateX(20px); /* Adjust based on the width of the slider */
    }
  </style>
  <body class="bg-purple-50 p-3 w-80">
    <div class="bg-white rounded-lg shadow-sm border border-purple-100 space-y-3 p-3">
      <div class="flex justify-between items-center">
        <div class="hover:bg-purple-100 rounded-md px-2 py-1 cursor-pointer" id="redirectInfoPage">
          <h1 class="font-bold text-lg">GIF Viber</h1>
          <p class="text-xs text-purple-800">Make your browser happier</p>
        </div>
        <div class="flex items-center gap-2 text-sm">
          <span class="font-semibold text-purple-800">GIF</span>
          <label class="switch">
            <input type="checkbox" id="onSwitch" class="bg-purple-500" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="space-y-2">
        <label for="newUrl" class="mr-2 font-semibold">New GIF URL</label>
        <div class="flex items-center gap-2">
          <input
            type="text"
            id="newUrl"
            class="rounded border border-purple-300 h-9 flex-grow px-2 text-sm"
            placeholder="https://...gif" />
          <button
            id="urlButton"
            class="w-9 h-9 bg-purple-100 hover:bg-purple-200 rounded-md text-lg font-semibold text-purple-800"
            title="Apply GIF URL">
            →
          </button>
          <button
            id="saveUrlButton"
            class="px-3 h-9 bg-purple-600 text-white rounded-md text-sm hover:bg-purple-700"
            title="Save GIF URL to list">
            Save
          </button>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 text-xs text-purple-900 bg-purple-50 rounded-md p-2">
        <div class="space-y-1">
          <label for="widthRange" class="font-semibold">Size</label>
          <input type="range" id="widthRange" min="50" max="400" class="bg-purple-500" />
        </div>
        <div class="space-y-1">
          <label for="topRange" class="font-semibold">Top</label>
          <input type="range" id="topRange" min="0" max="800" class="bg-purple-500" />
        </div>
        <div class="space-y-1">
          <label for="rightRange" class="font-semibold">Right</label>
          <input type="range" id="rightRange" min="0" max="1706" class="bg-purple-500" />
        </div>
      </div>

      <div class="bg-purple-50 rounded-md p-2 space-y-2">
        <div class="flex items-center justify-between">
          <p class="font-semibold text-sm text-purple-900">Saved GIFs</p>
          <button
            id="refreshSaved"
            class="text-xs text-purple-700 hover:text-purple-900 underline">
            Refresh
          </button>
        </div>
        <ul id="savedUrlsList" class="space-y-1 max-h-24 overflow-y-auto text-xs"></ul>
      </div>

      <div class="bg-purple-100 rounded-md p-2 flex items-center gap-3">
        <img id="gifPreview" src="" alt="GIF preview" class="w-20 h-20 object-contain rounded" />
        <div class="text-xs text-purple-900 space-y-1">
          <p class="font-semibold">Active GIF preview</p>
          <p id="activeGifLabel" class="break-all leading-tight"></p>
        </div>
      </div>

      <script src="popup.js"></script>
    </div>
  </body>
</html>
