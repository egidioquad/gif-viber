<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>
  <style>
    input[type="range"] {
      --track-color: #a78bfa;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 6px;
      background: var(--track-color);
      outline: none;
      margin: 8px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid #7c3aed;
      background: #f5f3ff;
      cursor: pointer;
    }

    input[type="range"]:active::-webkit-slider-thumb {
      background: #c4b5fd;
    }

    h1,
    label,
    button,
    p,
    input,
    span {
      font-family: "Quicksand", sans-serif;
    }

    input[type="text"] {
      background-color: #241445;
      color: #f5f3ff;
      caret-color: #f5f3ff;
    }

    input[type="text"]::placeholder {
      color: #c4b5fd;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #f5f3ff;
      box-shadow: 0 0 0px 1000px #241445 inset;
      transition: background-color 9999s ease-in-out 0s;
      caret-color: #f5f3ff;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch .slider {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
      border-radius: 20px;
      background-color: #4c1d95;
      transition: background-color 0.3s ease;
    }

    .switch input:checked + .slider {
      background-color: #7c3aed;
    }

    .switch .slider::before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      border-radius: 50%;
      background-color: white;
      transition: transform 0.3s ease;
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }
  </style>
  <body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-black p-3 w-72 text-white">
    <div class="bg-purple-950/70 border border-purple-700 rounded-xl shadow-lg space-y-3 p-3">
      <div class="flex justify-between items-center">
        <div class="hover:bg-purple-800/40 rounded-md px-2 py-1 cursor-pointer" id="redirectInfoPage">
          <h1 class="font-bold text-lg text-purple-100">GIF Viber</h1>
          <p class="text-xs text-purple-200">Paste a gif link and start vibing</p>
        </div>
        <div class="flex items-center gap-2 text-sm">
          <span class="font-semibold text-purple-100">GIF</span>
          <label class="switch">
            <input type="checkbox" id="onSwitch" class="bg-purple-500" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="space-y-2">
        <label for="newUrl" class="mr-2 font-semibold text-purple-100">New GIF URL</label>
        <div class="flex flex-col gap-2">
          <input
            type="text"
            id="newUrl"
            autocomplete="off"
            class="rounded-lg border border-purple-700 h-10 px-3 text-sm bg-purple-900/60 text-purple-100 placeholder-purple-400"
            placeholder="Paste a GIF link" />
          <div class="flex items-center gap-2">
            <button
              id="urlButton"
              class="w-9 h-9 bg-purple-700 hover:bg-purple-600 rounded-lg text-lg font-semibold text-white"
              title="Apply GIF URL">
              >
            </button>
            <button
              id="saveUrlButton"
              class="flex-1 h-9 bg-indigo-500 text-white rounded-lg text-sm hover:bg-indigo-400"
              title="Save GIF URL to list">
              Save
            </button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 text-xs text-purple-100 bg-purple-900/50 rounded-lg p-2 border border-purple-800">
        <div class="space-y-1">
          <label for="widthRange" class="font-semibold">Size</label>
          <input type="range" id="widthRange" min="50" max="400" class="bg-purple-500" />
        </div>
        <div class="space-y-1">
          <label for="topRange" class="font-semibold">Top</label>
          <input type="range" id="topRange" min="0" max="800" class="bg-purple-500" />
        </div>
        <div class="space-y-1">
          <label for="rightRange" class="font-semibold">Right</label>
          <input type="range" id="rightRange" min="0" max="1706" class="bg-purple-500" />
        </div>
      </div>

      <div class="flex justify-center items-center">
        <button
          id="savedPageButton"
          class="w-full h-10 bg-purple-800/80 hover:bg-purple-700 text-white rounded-lg text-sm border border-purple-600">
          Saved images
        </button>
      </div>

      <script src="popup.js"></script>
    </div>
  </body>
</html>
